<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Neo-Brutalist Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#4f46e5" fill-opacity="0.18" />
    </pattern>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="#0f172a" rx="28" />
  <rect width="500" height="500" fill="url(#dotGrid)" rx="28" />

  <!-- Outer Neo-Brutalist Frame -->
  <rect x="20" y="20" width="460" height="460" rx="20" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />

  <!-- Code Bracket Accents -->
  <text x="45" y="80" font-family="monospace" font-size="32" font-weight="900" fill="#fbbf24" opacity="0.9">&lt;dev&gt;</text>
  <text x="360" y="445" font-family="monospace" font-size="32" font-weight="900" fill="#22d3ee" opacity="0.9">&lt;/dev&gt;</text>

  <!-- Central Circular Aura Glow -->
  <circle cx="250" cy="240" r="145" fill="#4f46e5" fill-opacity="0.25" stroke="#6366f1" stroke-width="3" />
  <circle cx="250" cy="240" r="125" fill="#1e1b4b" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Stylized Developer Silhouette & Headset / Glasses / Tech Visor -->
  <!-- Shoulders / Torso -->
  <path d="M140 395 C140 325, 185 295, 250 295 C315 295, 360 325, 360 395 Z" fill="url(#cyberGrad)" stroke="#121212" stroke-width="4" />
  
  <!-- Hoodie / Collar Detail -->
  <path d="M215 295 L250 345 L285 295 Z" fill="#0f172a" stroke="#6366f1" stroke-width="3" />

  <!-- Head -->
  <ellipse cx="250" cy="220" rx="60" ry="70" fill="#f8fafc" stroke="#121212" stroke-width="4" />

  <!-- Modern Hair / Cap Profile -->
  <path d="M188 200 C190 145, 250 140, 312 195 C312 170, 275 145, 220 155 C195 160, 188 180, 188 200 Z" fill="#1e1b4b" stroke="#121212" stroke-width="3" />

  <!-- Cyber Visor / Terminal Glasses -->
  <rect x="200" y="198" width="100" height="32" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="3.5" />
  <text x="212" y="221" font-family="monospace" font-size="16" font-weight="900" fill="#22c55e">0101_</text>
  <circle cx="288" cy="214" r="4" fill="#22d3ee" />

  <!-- Headset Ear Piece & Arc -->
  <path d="M185 210 Q180 160 250 155 Q320 160 315 210" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
  <rect x="176" y="200" width="14" height="34" rx="6" fill="#fbbf24" stroke="#121212" stroke-width="2.5" />
  <rect x="310" y="200" width="14" height="34" rx="6" fill="#fbbf24" stroke="#121212" stroke-width="2.5" />
  <!-- Microphone -->
  <path d="M180 230 Q180 255 215 255" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="218" cy="255" r="4.5" fill="#ef4444" />

  <!-- Neo-Brutalist Floating Tech Badge -->
  <g transform="translate(160, 410)">
    <rect width="180" height="42" rx="10" fill="#fbbf24" stroke="#121212" stroke-width="3.5" filter="drop-shadow(3px 3px 0px #121212)" />
    <text x="90" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#121212" text-anchor="middle" letter-spacing="1">⚡ JR. DEV</text>
  </g>
</svg>
